<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Share card</title>
<meta name="robots" content="noindex">
<!-- One link card, 1200x630, drawn from the site's own parts: its stylesheet (tokens, fonts, the title's coral brush and
     gold star, the name slip, the taped photo), the Book's plates in /img/book and the studio mark. tools/sharecard.py
     opens this page through a local server in headless Chrome, with the card's words and pictures in ?c=<json>, and
     saves the screenshot. Not a page of the site: _config.yml leaves tools/ out. -->
<link rel="stylesheet" href="/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #12163a url("/img/book/paper-night.webp") 0 0 / 1024px 1024px; color: var(--film-text); }
  .share { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  /* a picture filling the card, darkened on the left so the words read over it (the front page's first screen) */
  .bleed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* a render whose body stands mid-picture slides right, its left edge fading into the night, so the tag never covers it */
  .bleed.shifted { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 26%); mask-image: linear-gradient(90deg, transparent 0, #000 26%); }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(14, 16, 44, 0.94) 0%, rgba(14, 16, 44, 0.78) 34%, rgba(14, 16, 44, 0.12) 64%, rgba(14, 16, 44, 0) 100%),
                linear-gradient(0deg, rgba(14, 16, 44, 0.55) 0%, rgba(14, 16, 44, 0) 30%); }

  /* the mark and the name, as the header carries them */
  .brand { position: absolute; left: 56px; top: 40px; display: flex; align-items: center; gap: 14px;
    font-family: var(--font-hand); font-size: 34px; line-height: 1; color: var(--film-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6); }
  .brand img { width: 48px; height: 48px; }
  .where { position: absolute; right: 44px; bottom: 30px; font-family: var(--font-hand); font-size: 28px;
    color: var(--film-soft); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8); }

  /* ---- the site card: the front page's title A over Old Hunger ---- */
  .k-site .bleed { object-position: 78% 50%; }
  .k-site .title { position: absolute; left: 56px; top: 128px; margin: 0; display: flex; flex-direction: column;
    align-items: flex-start; gap: 6px; font-family: var(--font-hand); font-weight: 400; font-size: 124px; line-height: 1;
    color: var(--film-text); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55); }
  .k-site .title .title-mark { padding-bottom: 0.18em; }
  .k-site .t-game { position: relative; isolation: isolate; margin-top: 10px; font-size: 54px; line-height: 1.15;
    padding: 4px 46px 8px; color: #2b2452; text-shadow: none; transform: rotate(-2deg); }
  .k-site .t-game::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: url("/img/book/slip-mid.webp") center / 100% 100% no-repeat; filter: drop-shadow(1px 3px 3px rgba(0, 0, 0, 0.35)); }
  .strip { position: absolute; left: 64px; bottom: 58px; display: grid; grid-template-columns: auto auto;
    grid-template-areas: "faces title" "faces line"; align-items: center; column-gap: 22px; padding: 16px 26px 18px 22px;
    color: #2b2452; background: #f7ecd6 url("/img/book/paper-day.webp") 0 0 / 1024px 1024px; border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(120, 90, 60, 0.18), 4px 12px 26px -6px rgba(0, 0, 0, 0.6); transform: rotate(-0.8deg); }
  .strip::before { content: ""; position: absolute; left: -30px; top: -12px; width: 100px; height: 34px;
    background: url("/img/book/tape-2.webp") 0 0 / 100% 100% no-repeat; transform: rotate(-30deg);
    filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.2)); }
  .strip h2 { grid-area: title; margin: 0; font-family: var(--font-hand); font-weight: 400; font-size: 40px; line-height: 1.05; color: #2b2452; }
  .strip p { grid-area: line; margin: 4px 0 0; font-family: var(--font-body); font-size: 25px; line-height: 1.25; color: #2b2452; }
  .faces { grid-area: faces; display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
  .faces li { position: relative; }
  .faces li + li { margin-left: 30px; }
  .faces li + li::before { content: ""; position: absolute; left: -28px; top: 50%; width: 26px; height: 19px; margin-top: -9px;
    background: url("/img/book/swap-arrows.svg") center / 100% 100% no-repeat; }
  .faces img { display: block; width: 66px; height: 66px; border-radius: 50%; border: 4px solid #fffdf8;
    box-shadow: 0 0 0 4px var(--hero), 2px 3px 6px rgba(30, 20, 60, 0.35); }

  /* ---- a character card: the render banner, the name on a paper tag ---- */
  .tag { position: absolute; left: 56px; bottom: 60px; max-width: 560px; padding: 22px 34px 26px 30px;
    color: #2b2452; background: #f7ecd6 url("/img/book/paper-day.webp") 0 0 / 1024px 1024px; border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(120, 90, 60, 0.18), 4px 12px 26px -6px rgba(0, 0, 0, 0.6); transform: rotate(-1deg); }
  .tag::before { content: ""; position: absolute; left: -30px; top: -12px; width: 100px; height: 34px;
    background: url("/img/book/tape-1.webp") 0 0 / 100% 100% no-repeat; transform: rotate(-30deg);
    filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.2)); }
  .eyebrow-row { display: flex; align-items: center; gap: 12px; font-family: var(--font-hand); font-size: 32px; line-height: 1; color: #625a86; }
  .eyebrow-row img { width: 46px; height: 46px; }
  .tag h1 { margin: 6px 0 0; font-family: var(--font-hand); font-weight: 400; font-size: 96px; line-height: 1.02; color: #2b2452; }
  .tag p { margin: 8px 0 0; font-family: var(--font-body); font-size: 24px; line-height: 1.3; color: #2b2452; }

  /* ---- a devlog card: the post's lead picture taped in beside its title ---- */
  .k-post .photo { position: absolute; right: 62px; top: 146px; width: 600px; padding: 12px 12px 16px; transform: rotate(1.6deg); }
  .k-post .photo > img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .k-post .photo::before, .k-post .photo::after { width: 110px; height: 40px; }
  .k-post .words { position: absolute; left: 56px; top: 170px; width: 440px; }
  .k-post .eyebrow-row { color: var(--film-soft); font-size: 34px; }
  .k-post .eyebrow-row .slip { font-size: 30px; padding: 2px 22px 6px; }
  .k-post h1 { margin: 18px 0 0; font-family: var(--font-hand); font-weight: 400; font-size: 70px; line-height: 1.04; color: var(--film-text); }
  .k-post h1 .title-mark { padding-bottom: 0.22em; }
  .k-post h1.long { font-size: 56px; }

  /* ---- the party card (/shatterbound/): the heroes' and the bosses' painted stickers ---- */
  .k-party h1 { position: absolute; left: 0; right: 0; top: 112px; margin: 0; text-align: center; font-family: var(--font-hand);
    font-weight: 400; font-size: 76px; line-height: 1; color: var(--film-text); }
  .rows { position: absolute; left: 0; right: 0; top: 236px; display: grid; gap: 26px; justify-items: center; }
  .row { display: flex; gap: 46px; list-style: none; margin: 0; padding: 0; }
  .row li { display: flex; flex-direction: column; align-items: center; }
  .row img { display: block; border-radius: 50%; border: 5px solid #fffdf8; box-shadow: 0 0 0 5px var(--hero, #6f7cff), 3px 6px 12px rgba(0, 0, 0, 0.45); }
  .row.heroes img { width: 150px; height: 150px; }
  .row.bosses { gap: 70px; }
  .row.bosses img { width: 104px; height: 104px; }
  .row .slip { margin-top: -16px; font-size: 30px; }
  .row.bosses .slip { font-size: 24px; margin-top: -12px; }
</style>
</head>
<body>
<div class="share" id="share"></div>
<script>
  // ?c=<json>: {kind, ...}. Each kind lays the site's parts out its own way.
  var c = JSON.parse(new URLSearchParams(location.search).get("c"));
  var card = document.getElementById("share");
  card.classList.add("k-" + c.kind);  // k-: the kinds keep clear of the site's own classes (.post, .card)
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (m) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[m]; }); };
  var brand = function (mark, name) {
    return '<div class="brand"><img src="' + mark + '" alt="">' + esc(name) + '</div>';
  };
  var html = "";
  if (c.kind === "site") {
    html = '<img class="bleed" src="' + c.image + '" alt=""><div class="shade"></div>' +
      brand("/img/brand/mark-chalk.svg", "Project Trinity Studios") +
      '<h1 class="title"><span class="title-mark title-star">Project Trinity</span><span class="t-game">Shatterbound</span></h1>' +
      '<div class="strip"><ul class="faces">' + c.faces.map(function (f) {
        return '<li style="--hero: var(--' + f + ')"><img src="/img/party/' + f + '.webp" alt=""></li>';
      }).join("") + '</ul><h2>' + esc(c.heading) + '</h2><p>' + esc(c.line) + '</p></div>' +
      '<div class="where">projecttrinity.dev</div>';
  } else if (c.kind === "character") {
    var shift = c.shift || 0;
    html = '<img class="bleed' + (shift ? " shifted" : "") + '" src="' + c.image + '" alt="" style="left: ' + shift + 'px">' +
      '<div class="shade"></div>' +
      brand("/img/brand/shatterbound/mark-chalk.svg", "Project Trinity: Shatterbound") +
      '<div class="tag"><div class="eyebrow-row">' + (c.stamp ? '<img src="' + c.stamp + '" alt="">' : "") + esc(c.eyebrow) + '</div>' +
      '<h1>' + esc(c.name) + '</h1>' + (c.line ? '<p>' + esc(c.line) + '</p>' : "") + '</div>' +
      '<div class="where">projecttrinity.dev</div>';
  } else if (c.kind === "post") {
    html = brand("/img/brand/mark-chalk.svg", "Project Trinity: Shatterbound") +
      '<div class="words"><div class="eyebrow-row"><span class="slip">Devlog</span>' + esc(c.eyebrow || "") + '</div>' +
      '<h1 class="' + (c.title.length > 38 ? "long" : "") + '"><span class="title-mark">' + esc(c.title) + '</span></h1></div>' +
      '<span class="photo"><img src="' + c.image + '" alt=""></span>' +
      '<div class="where">projecttrinity.dev</div>';
  } else if (c.kind === "party") {
    var row = function (ids, cls) {
      return '<ul class="row ' + cls + '">' + ids.map(function (p) {
        return '<li style="--hero: var(--' + p[0] + ', #6f7cff)"><img src="/img/party/' + p[0] + '.webp" alt=""><span class="slip">' + esc(p[1]) + '</span></li>';
      }).join("") + '</ul>';
    };
    html = brand("/img/brand/shatterbound/mark-chalk.svg", "Project Trinity: Shatterbound") +
      '<h1><span class="title-mark">' + esc(c.heading) + '</span></h1>' +
      '<div class="rows">' + row(c.heroes, "heroes") + row(c.bosses, "bosses") + '</div>' +
      '<div class="where">projecttrinity.dev</div>';
  }
  card.innerHTML = html;
  // tell the renderer when every picture and the fonts are in
  Promise.all([document.fonts.ready].concat([].map.call(document.images, function (i) {
    return i.complete ? 0 : new Promise(function (r) { i.onload = i.onerror = r; });
  }))).then(function () { document.title = "ready"; });
</script>
</body>
</html>
